# Celery worker for the LOCAL queue, running on the M4 Mac k3s
# (`rancher-desktop`) against the local Supabase.
#
# Sibling: deployment-prod.yaml is the production-queue worker, which runs in
# the SAME namespace against cloud Supabase. The two are told apart by the
# `environment` label and the queue they consume — keep both selectors
# specific or one deployment adopts the other's pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-table-celery-worker-local
  namespace: match-scraper
  labels:
    app: missing-table-worker
    environment: local
spec:
  # One replica. The tracked manifest said 2 and the cluster ran 1 — and 2
  # does not fit: a rolling update needs a third pod briefly, and the
  # single-node k3s has no CPU for it (FailedScheduling, Insufficient cpu).
  replicas: 1
  # Recreate, not RollingUpdate. This is a single-node k3s with no CPU
  # headroom for a surge pod — a rolling update leaves the new pod Pending
  # with "Insufficient cpu" until the rollout times out. A queue consumer can
  # afford the gap: unacked messages stay in RabbitMQ and are redelivered.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: missing-table-worker
      environment: local
  template:
    metadata:
      labels:
        app: missing-table-worker
        environment: local
    spec:
      # Pod-level securityContext as well as the container one below.
      # Trivy's KSV-0118 checks both, and it has a point: a pod spec with no
      # securityContext means anything added to it later inherits nothing.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: celery-worker
        image: missing-table-worker:latest
        imagePullPolicy: Never  # Use local image (k3s/rancher-desktop)

        # Run in worker mode
        command:
          - /app/docker-entrypoint.sh
        args:
          - worker
          - --loglevel=info
          - --queues=matches
          - --concurrency=4

        env:
        # RabbitMQ Configuration
        - name: RABBITMQ_URL
          valueFrom:
            configMapKeyRef:
              name: missing-table-worker-config
              key: RABBITMQ_URL

        - name: CELERY_BROKER_URL
          valueFrom:
            configMapKeyRef:
              name: missing-table-worker-config
              key: CELERY_BROKER_URL

        # Result Backend Configuration (RPC - no Redis needed)
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            configMapKeyRef:
              name: missing-table-worker-config
              key: CELERY_RESULT_BACKEND

        # Supabase Configuration (from ConfigMap)
        - name: SUPABASE_URL
          valueFrom:
            configMapKeyRef:
              name: missing-table-worker-config
              key: SUPABASE_URL

        # Supabase Secrets (from Secret)
        - name: SUPABASE_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: missing-table-worker-secrets
              key: SUPABASE_KEY

        - name: SUPABASE_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: missing-table-worker-secrets
              key: SUPABASE_JWT_SECRET

        - name: SERVICE_ACCOUNT_SECRET
          valueFrom:
            secretKeyRef:
              name: missing-table-worker-secrets
              key: SERVICE_ACCOUNT_SECRET

        # --- Ingest failure alerts (SB-829) ---
        # Normally unset locally, which is fine: the failure is still recorded
        # in ingest_failures and readable at GET /api/admin/ingest-failures.
        # Set them to rehearse the alert before trusting it in prod.
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: missing-table-worker-secrets
              key: TELEGRAM_BOT_TOKEN
              optional: true

        - name: MT_ADMIN_TELEGRAM_CHAT_ID
          valueFrom:
            configMapKeyRef:
              name: missing-table-worker-config
              key: MT_ADMIN_TELEGRAM_CHAT_ID
              optional: true

        # Application Configuration
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: missing-table-worker-config
              key: ENVIRONMENT

        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: missing-table-worker-config
              key: LOG_LEVEL


        # Hardening. Trivy flags a container with no securityContext, and it
        # was right to: everything below was the default before SB-832, on a
        # worker holding the Supabase service key.
        #
        # Not fixed here, deliberately:
        #   KSV-0014 read-only root filesystem — see the note below.
        #   KSV-0013 image tag ":latest" — the image is built locally and
        #     mounted with imagePullPolicy: Never; there is no registry to
        #     pin a digest against.
        #   KSV-0020/0021 UID/GID <= 10000 — the image chowns /app to
        #     appuser (1000). Renumbering the user belongs in the Dockerfile,
        #     not in a manifest that would then not start.
        securityContext:
          # The image already runs as appuser (uid 1000); this states it so
          # the cluster enforces it rather than trusting the build.
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          # KSV-0014 (read-only root filesystem) is NOT set, and this is not
          # an oversight. The entrypoint runs `uv run`, which reconciles
          # /app/.venv at startup; with a read-only root it dies on
          #   error: failed to remove directory `/app/.venv/include`:
          #   Read-only file system (os error 30)
          # and the pod crash-loops. Making this true means making the image
          # not rebuild its venv at boot — a Dockerfile/entrypoint change,
          # not a manifest one.
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        # Health probes disabled - workers are stateless consumers
        # They connect to RabbitMQ on startup and begin consuming
        # No need for complex health checks for this use case

      # Restart policy
      restartPolicy: Always
